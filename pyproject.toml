[project]
name = "contrasted"
version = "1.0.0"
description = "Supervised contrastive learning for CATH protein superfamily classification"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.13"
authors = [{ name = "David Miller", email = "dmmiller597@gmail.com" }]
keywords = [
    "protein",
    "contrastive-learning",
    "cath",
    "protein-language-model",
    "knn",
    "pytorch"
]
dependencies = [
    "torch>=2.0,<2.3; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torch>=2.6,<2.7; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "lightning>=2.6",
    "numpy>=1.20,<2",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "tqdm>=4.60",
    # ProstT5 encoder (FASTA -> contrasted annotations runs end-to-end)
    "transformers>=4.40,<5",
    # Pinned: 0.2.1+ may publish only manylinux_2_27 wheels (glibc 2.27+). 0.2.0 has
    # manylinux2014 wheels for cp311. Bump only after checking PyPI wheel tags for all platforms.
    "sentencepiece==0.2.0",
]

[project.urls]
Repository = "https://github.com/dmmiller597/contrasted"
Issues = "https://github.com/dmmiller597/contrasted/issues"

[project.scripts]
contrasted-train = "contrasted.train:main"
contrasted-embed = "contrasted.embed:main"
contrasted-make-db = "contrasted.make_db:main"
contrasted-annotate = "contrasted.annotate:main"
contrasted-build-concat-store = "contrasted.concat:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
    "ty",
]
# Local research tree only (analysis/ is gitignored). Not a PyPI extra.
analysis = [
    "faiss-cpu>=1.13.2",
    "h5py>=3.11",
    "protspace>=2.1",
    "polars>=1.0",
    "matplotlib>=3.10.8",
    "scipy>=1.17.0",
    "scikit-learn>=1.8.0",
    "umap-learn>=0.5.6",
    "python-igraph>=1.0.0",
    "leidenalg>=0.11.0",
    "numba>=0.59",
    "llvmlite>=0.42",
    "biotite>=1.6.0",
    "progres>=1.1.0",
    "lmdb>=1.7.5",
    "pillow>=12.1.0",
    "requests>=2.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contrasted"]

# Only preprint configs ship in the wheel (Hydra hydra_config_dir()).
[tool.hatch.build.targets.wheel.force-include]
"configs/__init__.py" = "configs/__init__.py"
"configs/annotate.yaml" = "configs/annotate.yaml"
"configs/embed.yaml" = "configs/embed.yaml"
"configs/make_db.yaml" = "configs/make_db.yaml"
"configs/make_db_s20.yaml" = "configs/make_db_s20.yaml"
"configs/train.yaml" = "configs/train.yaml"
"configs/train/__init__.py" = "configs/train/__init__.py"
"configs/train/cath_s20_aa3di.yaml" = "configs/train/cath_s20_aa3di.yaml"
"configs/train/cath_s40_aa3di.yaml" = "configs/train/cath_s40_aa3di.yaml"
"configs/logger/csv.yaml" = "configs/logger/csv.yaml"
"configs/model/loss/ccl.yaml" = "configs/model/loss/ccl.yaml"

# Method-only sdist: package, configs, tests, and project metadata.
[tool.hatch.build.targets.sdist]
only-include = [
  "src/contrasted",
  "configs",
  "tests",
  "pyproject.toml",
  "README.md",
  "LICENSE",
  "contrasted-logo.png",
]
# Lab-absolute production recipes must not ship even if they are on disk.
exclude = [
  "configs/train/cath_ted_dualfilt_*.yaml",
  "configs/train/held_out_superfamilies_*.yaml",
]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src"]
exclude = [
    ".venv",
    "_archive",
    "tests/analysis",
    "analysis",
]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["configs", "contrasted"]

[tool.ty.environment]
python-version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
