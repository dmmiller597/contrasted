defaults:
  - model/loss: ccl
  - _self_

seed: 40

datamodule:
  _target_: contrasted.datamodule.EmbeddingDataModule
  train_fasta: data/cath_s40_split/train.fasta
  val_fasta: data/cath_s40_split/val.fasta
  test_fasta: data/cath_s40_split/test.fasta
  embedding_dir: data/embeddings/cath-s100-aa3di-concat
  batch_size: 1024
  num_workers: 4

model:
  _target_: contrasted.model.ContrastiveModel
  projection_head:
    _target_: contrasted.projection.ProjectionHead
    input_dim: 2048
    hidden_dim: 512
    output_dim: 128
    dropout: 0.1
  learning_rate: 0.012
  weight_decay: 1e-4
  max_epochs: ${trainer.max_epochs}
  warmup_epochs: 10

trainer:
  max_epochs: 200
  accelerator: auto
  devices: auto
  precision: bf16-mixed
  gradient_clip_val: 1.0
  deterministic: true
  default_root_dir: ${hydra:run.dir}

logger:
  _target_: lightning.pytorch.loggers.CSVLogger
  save_dir: ${hydra:run.dir}/csv_logs

callbacks:
  - _target_: lightning.pytorch.callbacks.ModelCheckpoint
    monitor: val/knn_accuracy
    mode: max
    save_top_k: 1
    dirpath: ${hydra:run.dir}/checkpoints
  - _target_: lightning.pytorch.callbacks.EarlyStopping
    monitor: val/knn_accuracy
    mode: max
    patience: 15
    min_delta: 0.001
  - _target_: lightning.pytorch.callbacks.LearningRateMonitor
  - _target_: contrasted.callbacks.KNNEvaluationCallback
  - _target_: contrasted.callbacks.HeadExportCallback

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  job:
    chdir: false
