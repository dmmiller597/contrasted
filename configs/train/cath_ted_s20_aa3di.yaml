# @package _global_
# CATH S20 train + TED Gold S40 reps filtered at 20% ID vs S20 val/test.
# AA∥3Di (2048-d); S20 CCL.
defaults:
  # Absolute (leading /) so this resolves to configs/train.yaml, not
  # configs/train/train.yaml -- these recipes live in a subdirectory.
  - /train
  - _self_

seed: 40
loss_name: cath_ted_concat_s20
test_after_fit: true

datamodule:
  train_fasta: /SAN/orengolab/cath_plm/contrasted/data/ted_s40_lt20_vs_s20_valtest_v2/train_s20_plus_ted.fasta
  val_fasta: data/cath_s20_split/val.fasta
  test_fasta: data/cath_s20_split/test.fasta
  # Train-time / test_after_fit Acc_H gallery (not the 11M CATH+TED train set).
  knn_index_fasta: data/cath_s20_split/train.fasta
  embedding_dir: /SAN/orengolab/functional-families/contrasted/data/embeddings/cath-ted-s20-remote-v2-concat
  batch_size: 1024
  num_workers: 4
  balanced_sampler: true
  m_per_class: 2
  batches_per_epoch: 112
  strict_split_checks: false

model:
  learning_rate: 0.012
  weight_decay: 1.0e-4
  warmup_epochs: 10
  projection_head:
    input_dim: 2048


trainer:
  max_epochs: 80
  accelerator: gpu
  devices: 1
  precision: bf16-mixed
  gradient_clip_val: 1.0
  deterministic: true
  use_distributed_sampler: false
  default_root_dir: ${hydra:run.dir}

callbacks:
  - _target_: lightning.pytorch.callbacks.ModelCheckpoint
    monitor: val/knn_accuracy
    mode: max
    save_top_k: 1
    filename: "best-{epoch}"
    dirpath: ${hydra:run.dir}/checkpoints
  - _target_: lightning.pytorch.callbacks.EarlyStopping
    monitor: val/knn_accuracy
    mode: max
    patience: 15
    min_delta: 0.001
  - _target_: lightning.pytorch.callbacks.LearningRateMonitor
  - _target_: contrasted.callbacks.KNNEvaluationCallback
  - _target_: contrasted.callbacks.HeadExportCallback
  - _target_: contrasted.callbacks.SetEpochCallback

hydra:
  run:
    dir: /SAN/orengolab/cath_plm/contrasted/outputs/cath_s20_remote_v2/aa3di/seed_${seed}
  job:
    chdir: false
