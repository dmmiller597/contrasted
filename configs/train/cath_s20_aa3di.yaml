# @package _global_
# CATH S20, Center-Contrastive on AA∥3Di concat.
# Same loss as the manuscript heads (scale=32, margin=0.3, lambda=1.0, ls=0.1).
defaults:
  # Absolute (leading /) so this resolves to configs/train.yaml, not
  # configs/train/train.yaml -- these recipes live in a subdirectory.
  - /train
  - _self_

seed: 40
loss_name: ccl_s20
test_after_fit: true

datamodule:
  train_fasta: data/cath_s20_split/train.fasta
  val_fasta: data/cath_s20_split/val.fasta
  test_fasta: data/cath_s20_split/test.fasta
  embedding_dir: data/embeddings/cath-s100-aa3di-concat
  batch_size: 1024
  num_workers: 4
  balanced_sampler: true
  m_per_class: 2
  batches_per_epoch: 112
  strict_split_checks: false

model:
  learning_rate: 0.012
  weight_decay: 1.0e-4
  warmup_epochs: 10
  min_lr: 1.0e-6
  projection_head:
    input_dim: 2048
    hidden_dim: 512
    output_dim: 128
    dropout: 0.1

logger:
  _target_: lightning.pytorch.loggers.CSVLogger
  save_dir: ${hydra:run.dir}/csv_logs

trainer:
  max_epochs: 80
  accelerator: gpu
  devices: 1
  precision: bf16-mixed
  gradient_clip_val: 1.0
  deterministic: true
  use_distributed_sampler: false
  default_root_dir: ${hydra:run.dir}

callbacks:
  - _target_: lightning.pytorch.callbacks.ModelCheckpoint
    monitor: val/knn_accuracy
    mode: max
    save_top_k: 1
    filename: "best-{epoch}-{val/knn_accuracy:.4f}"
    dirpath: ${hydra:run.dir}/checkpoints
  - _target_: lightning.pytorch.callbacks.EarlyStopping
    monitor: val/knn_accuracy
    mode: max
    patience: 15
    min_delta: 0.001
  - _target_: lightning.pytorch.callbacks.LearningRateMonitor
  - _target_: contrasted.callbacks.KNNEvaluationCallback
  - _target_: contrasted.callbacks.HeadExportCallback
  - _target_: contrasted.callbacks.SetEpochCallback

hydra:
  run:
    dir: outputs/train/${loss_name}/seed_${seed}/${now:%Y-%m-%d_%H-%M-%S}
  job:
    chdir: false
