input: data/cath-domain-seqs-S100-c123.fasta
# Annotation strategy. Centroid is the manuscript headline method.
method: centroid
# Used for knn; centroid always forces k=1.
k: 1
id_to_annotation: data/cath-domain-sf-list-c123.txt
# Production CCL AA∥3Di head (S40).
model_path: checkpoints/cath_ccl_aa3di/s40_seed40.ckpt

# Prebuilt 2048-d AA∥3Di store (contrasted-build-concat-store).
embedding_dir: data/embeddings/cath-s100-aa3di-concat

index: data/vector_db/cath_s100_c123_s40.pt
output_dir: outputs/annotations

# Cosine-DISTANCE cutoff (distance = 1 - cosine_similarity, range [0, 2]).
# Val-locked 98% gates are split/metric-specific; 0.21 is a permissive starting
# point near the production CCL S40 centroid operating region — override per run.
distance_cutoff: 0.21
return_distance: true
return_confidence: false
return_true_annotation: false
batch_size: 8192
tm_align: false
structure_dir: null
tmalign_binary: TMalign
compute_metrics: false
num_thresholds: 50
